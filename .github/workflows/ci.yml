name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
      - run: mise exec -- bun install --frozen-lockfile --ignore-scripts
      - run: mise exec -- bun run check
      - name: Require explicit affected-plugin changesets
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        run: mise exec -- bun scripts/release-policy.ts "origin/$BASE_BRANCH"
        env:
          BASE_BRANCH: ${{ github.base_ref || 'main' }}
