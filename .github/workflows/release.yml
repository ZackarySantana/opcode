name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  version:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: 2026.10.11
          sha256: f9612efcddda0ae55b62d3b6f82a6c860d5b54ebee0807d4f1a1d578055e1607
          cache: false
      - run: mise exec -- bun install --frozen-lockfile --ignore-scripts
      - name: Open or update independent release PR
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1 (Changesets CLI 2)
        with:
          github-token: ${{ github.token }}
          version: mise exec -- bun scripts/version.ts
          commitMode: github-api
          title: 'chore(release): publish plugins'
          commit: 'chore: version plugins'
          createGithubReleases: false
      - name: Update release PR title and publishing instructions
        id: release-pr
        if: steps.changesets.outputs.pullRequestNumber != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.changesets.outputs.pullRequestNumber }}
          BASE_SHA: ${{ github.sha }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" |
            mise exec -- bun scripts/release-pr.ts "$BASE_SHA" |
            gh api --method PATCH \
              "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" \
              --input - --silent

  # Unprivileged: tests, builds, packs, and reads the registry. Publishing is
  # gated on versions missing from npm, not on whether changesets are pending.
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      packages: ${{ steps.pending.outputs.packages }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: 2026.10.11
          sha256: f9612efcddda0ae55b62d3b6f82a6c860d5b54ebee0807d4f1a1d578055e1607
          cache: false
      - run: mise exec -- bun install --frozen-lockfile --ignore-scripts
      - run: mise exec -- bun run check
      - run: mise exec -- bun scripts/publish.ts --dry-run
      - name: Find staged versions missing from npm
        id: pending
        run: mise exec -- bun scripts/publish.ts --pending --from .release/tarballs
      - name: Copy tarballs out of the hidden staging directory
        run: cp -R .release/tarballs "$RUNNER_TEMP/npm-tarballs"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-tarballs
          path: ${{ runner.temp }}/npm-tarballs/*.tgz
          if-no-files-found: error
          retention-days: 7

  # Privileged: never installs dependencies, tests, or builds; only publishes the
  # validated tarballs, rechecking each exact version against npm first.
  publish:
    needs: validate
    if: needs.validate.outputs.packages != '' && needs.validate.outputs.packages != '[]'
    runs-on: ubuntu-latest
    environment: npm
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: 2026.10.11
          sha256: f9612efcddda0ae55b62d3b6f82a6c860d5b54ebee0807d4f1a1d578055e1607
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-tarballs
          path: ${{ runner.temp }}/npm-tarballs
      - name: Publish only unpublished prebuilt tarballs using npm OIDC
        run: mise exec -- bun scripts/publish.ts --publish --from "$RUNNER_TEMP/npm-tarballs"
