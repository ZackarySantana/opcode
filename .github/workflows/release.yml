name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  version:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    outputs:
      hasChangesets: ${{ steps.changesets.outputs.hasChangesets }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          cache: false
      - run: mise exec -- bun install --frozen-lockfile --ignore-scripts
      - name: Open or update independent release PR
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1 (Changesets CLI 2)
        with:
          github-token: ${{ github.token }}
          version: mise exec -- bun scripts/version.ts
          commitMode: github-api
          title: 'Release plugins'
          commit: 'chore: version plugins'
          createGithubReleases: false
      - name: Clarify separate automatic publishing in the release PR
        if: steps.changesets.outputs.pullRequestNumber != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.changesets.outputs.pullRequestNumber }}
          OLD_SENTENCE: >-
            When you're ready to do a release, you can merge this and publish to npm yourself or [setup this action to publish automatically](https://github.com/changesets/action#with-publishing).
          NEW_SENTENCE: >-
            Merging this PR makes the reviewed plugin versions eligible for automatic publishing by the separate publish job in release.yml, subject to the configured npm environment protections and validation. Obtain release approval before merging.
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" |
            mise exec -- bun -e '
              const pr = JSON.parse(await Bun.stdin.text())
              const previous = process.env.OLD_SENTENCE
              const replacement = process.env.NEW_SENTENCE
              if (typeof pr.body !== "string" || !previous || !replacement) {
                throw new Error("Unexpected Changesets PR body")
              }
              if (!pr.body.includes(previous) && !pr.body.includes(replacement)) {
                throw new Error("Expected Changesets publication instructions were not found")
              }
              console.log(JSON.stringify({ body: pr.body.replace(previous, replacement) }))
            ' |
            gh api --method PATCH \
              "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" \
              --input - --silent

  publish:
    needs: version
    if: needs.version.outputs.hasChangesets == 'false'
    runs-on: ubuntu-latest
    environment: npm
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          cache: false
      - run: mise exec -- bun install --frozen-lockfile --ignore-scripts
      - run: mise exec -- bun run check
      - name: Publish only unpublished staged versions using npm OIDC
        run: mise exec -- bun scripts/publish.ts --publish
