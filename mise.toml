[tools]
bun = "1.4.3"
node = "24.22.0"

[tasks.dev]
description = "Build and try Opcode in OpenCode without manual configuration"
run = "bun scripts/dev.ts"

[tasks.prod]
description = "Install the published Opcode plugins in your global OpenCode config"
run = "bun scripts/prod.ts"

[tasks.check]
run = "bun run check"

[tasks.build]
run = "bun run build"

[tasks.smoke-ui]
description = "Build and verify real keyboard interaction in an isolated OpenCode PTY"
depends = ["build"]
run = "bun test/tui-smoke.ts"

[tasks.test]
run = "bun test"
